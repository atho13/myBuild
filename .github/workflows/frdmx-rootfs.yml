name: Frdmx rootFS

on:
  workflow_dispatch:
    inputs:
      custom_url:
        description: "URL Image Builder armvirt/64 (.tar.xz) versi 23.05, 24.10, atau 25.12"
        required: true
        default: ""
      custom_repo:
        description: "URL Repositori Pihak Ketiga (Opsional, pisahkan dengan koma jika lebih dari satu)"
        required: false
        default: ""

env:
  TZ: Asia/Jakarta
  WORKING_DIR: /builder/armvirt_ib
  OUTPUT_DIR: ${{ github.workspace }}/output

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo timedatectl set-timezone "${{ env.TZ }}"
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
          git libncurses5-dev libssl-dev rsync unzip zlib1g-dev \
          curl tar qemu-utils wget python3-setuptools python3-dev python-is-python3 zstd xz-utils
          sudo mkdir -p /builder
          sudo chown runner:runner /builder
          mkdir -p ${{ env.OUTPUT_DIR }}

      - name: Download Image Builder
        run: |
          mkdir -p ${{ env.WORKING_DIR }}
          curl -L "${{ github.event.inputs.custom_url }}" -o ib_archive.file
          tar -xf ib_archive.file -C ${{ env.WORKING_DIR }} --strip-components=1
          rm ib_archive.file

      - name: Build Firmware
        run: |
          cd ${{ env.WORKING_DIR }}
          
          # 1. Suntikkan ukuran partisi kustom (700 MB) langsung ke berkas .config bawaan Image Builder
          sed -i '/CONFIG_TARGET_ROOTFS_PARTSIZE/d' .config 2>/dev/null || true
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=700" >> .config
          
          # 2. Tambahkan repositori pihak ketiga secara otomatis jika diisi oleh pengguna
          if [ -n "${{ github.event.inputs.custom_repo }}" ]; then
            echo "Menambahkan repositori kustom..."
            IFS=',' read -r -a repos <<< "${{ github.event.inputs.custom_repo }}"
            index=1
            for repo in "${repos[@]}"; do
              repo_trimmed=$(echo "$repo" | xargs)
              echo "src/gz custom_repo_$index $repo_trimmed" >> repositories.conf
              ((index++))
            done
            echo "Isi repositories.conf terbaru:"
            cat repositories.conf
          fi
          
          # 3. Beri izin eksekusi secara massal untuk semua file di folder files/etc/uci-defaults/ Anda
          if [ -d "${{ github.workspace }}/files/etc/uci-defaults" ]; then
            chmod +x ${{ github.workspace }}/files/etc/uci-defaults/*
          fi
          
          PACKAGES="-dnsmasq dnsmasq-full base-files dropbear e2fsprogs firewall4 fstools \
          kmod-button-hotplug kmod-nft-offload libc libgcc libustream-mbedtls logd kmod-tcp-bbr \
          mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only partx-utils ppp ppp-mod-pppoe procd-ujail \
          uci uclient-fetch urandom-seed urngd luci luci-compat luci-lib-base kmod-usb-net-huawei-cdc-ncm \
          kmod-usb-net kmod-usb-net-rndis luci-lib-ip luci-lib-jsonc luci-lib-nixio luci-mod-admin-full \
          luci-mod-network kmod-usb-net-rtl8150 kmod-usb-net-rtl8152 kmod-usb-net-asix kmod-usb-net-asix-ax88179 \
          kmod-mii luci-mod-status luci-mod-system luci-proto-3g luci-proto-mbim mbim-utils picocom minicom \
          luci-proto-ncm luci-proto-ppp luci-proto-qmi screen kmod-tun ttyd kmod-usb-atm kmod-macvlan \
          kmod-usb-net-cdc-ncm kmod-usb-net-cdc-mbim luci-proto-modemmanager modemmanager modemmanager-rpcd \
          libqmi libmbim glib2 ipset libcap libcap-bin ruby ruby-yaml kmod-inet-diag kmod-nft-tproxy \
          ip-full php8 tcpdump irqbalance bc uhttpd uhttpd-mod-ubus unzip \
          uqmi usb-modeswitch uuidgen zstd wwan ziptool zoneinfo-asia zoneinfo-core zram-swap bash \
          openssh-sftp-server adb wget-ssl httping htop jq tar coreutils-sleep coreutils-stat nano fping \
          kmod-nls-utf8 kmod-usb-storage cgi-io chattr comgt comgt-ncm coremark coreutils coreutils-base64 \
          coreutils-nohup kmod-usb-net-sierrawireless kmod-usb-serial-qualcomm kmod-usb-serial-sierrawireless \
          luci-app-ttyd luci-theme-material iw iwinfo netdata vnstat2 vnstati2 php8-mod-mbstring php8-cli \
          php8-fastcgi php8-fpm php8-mod-session php8-mod-ctype php8-mod-fileinfo php8-mod-zip php8-mod-iconv"
      
          make image PROFILE="generic" \
               PACKAGES="${PACKAGES}" \
               FILES="${{ github.workspace }}/files" \
               IGNORE_ERRORS=1 \
               V=s
          
      - name: Kumpulkan Hasil
        run: |
          RESULT_DIR="${{ env.WORKING_DIR }}/bin/targets/armvirt/64"
          
          if [ -d "$RESULT_DIR" ]; then
            ZST_FILE=$(find $RESULT_DIR -type f -name "*rootfs.tar.zst" | head -n 1)
            GZ_FILE=$(find $RESULT_DIR -type f -name "*rootfs.tar.gz" | head -n 1)
            
            if [ -n "$ZST_FILE" ]; then
              echo "Mengonversi berkas .tar.zst OpenWrt Baru ke .tar.gz..."
              zstd -d -c "$ZST_FILE" | gzip > "${{ env.OUTPUT_DIR }}/openwrt-armvirt-64-generic-rootfs.tar.gz"
            elif [ -n "$GZ_FILE" ]; then
              echo "Menemukan berkas .tar.gz asli (Bawaan versi 23.05)..."
              cp "$GZ_FILE" "${{ env.OUTPUT_DIR }}/openwrt-armvirt-64-generic-rootfs.tar.gz"
            else
              echo "Error: RootFS tidak ditemukan di $RESULT_DIR"
              exit 1
            fi
          else
            echo "Error: Direktori build $RESULT_DIR tidak ditemukan!"
            exit 1
          fi       
          
          if [[ "${{ github.event.inputs.custom_url }}" == *"25.12"* ]]; then
            echo "build_tag=S905X_RootFS_25.12_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.custom_url }}" == *"24.10"* ]]; then
            echo "build_tag=S905X_RootFS_24.10_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          else
            echo "build_tag=S905X_RootFS_23.05_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.build_tag }}
          artifacts: "${{ env.OUTPUT_DIR }}/*.tar.gz"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## OpenWrt RootFS FRDMX S905X
            - **Target**: Amlogic armvirt-64 (Untuk STB S905X)
            - **Format**: .tar.gz (Universal Format)
            - **Custom Repo**: ${{ github.event.inputs.custom_repo || 'None' }}
