# =====================================================================
# Build Armbian Amlogic - Standalone Fixed Clean Edition (No Dependency Bugs)
# =====================================================================

name: Amlogic FRDMX Armbian

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      releases_branch:
        description: "Select the releases branch (codename)"
        required: false
        default: "noble"
        type: choice
        options:
          - bookworm
          - noble
      armbian_board:
        description: "Select device board"
        required: false
        default: "s905x-b860h"
        type: choice
        options:
          - s905x-b860h
          - s905x-hg680p
          - s905x2-hg680fj
          - s905x2-s905y2
      armbian_kernel:
        description: "Select kernel version"
        required: false
        default: "6.18.y"
      kernel_repo:
        description: "Set your custom kernel repository (Username/Repo)"
        required: false
        default: "atho13/kernel"
      kernel_tag:
        description: "Set the Release Tag of your custom kernel"
        required: false
        default: "stable"

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        id: init
        run: |
          # Bersihkan total sisa file kustomisasi apt pembatas
          sudo rm -f /etc/apt/apt.conf
          unset APT_CONFIG
          export DEBIAN_FRONTEND=noninteractive
          
          # Lakukan pembaruan repositori dasar
          sudo apt-get update -y
          
          # Pasang paket dependensi kompilasi utama secara manual (Daftar bersih tanpa script luar yang bug)
          sudo apt-get install -y \
            build-essential libncurses5-dev libssl-dev bc bison flex \
            libelf-dev xz-utils git curl wget jq pigz zstd fakeroot gh \
            binutils patch bzip2 gawk gettext unzip zip python3 python3-pip
          
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create Work Directory
        run: |
          sudo mkdir -p /builder/custom_kernel
          sudo mkdir -p /builder/rootfs_tmp
          mkdir -p output/
          mkdir -p build/output/images/

      - name: Download Custom Kernel
        id: get_kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /builder/custom_kernel
          echo "Downloading kernel from ${{ github.event.inputs.kernel_repo }} tag ${{ github.event.inputs.kernel_tag }}"
          gh release download ${{ github.event.inputs.kernel_tag }} --repo ${{ github.event.inputs.kernel_repo }} --pattern "*.tar.gz" --skip-existing || true
          
          if [ "$(ls -A . 2>/dev/null)" ]; then
              for f in *.tar.gz; do tar -xzvf "$f"; done
              rm -f *.tar.gz
              echo "Kernel extracted successfully."
          else
              echo "ERROR: Kernel kustom tidak ditemukan di rilis GitHub Anda!"
              exit 1
          fi

      - name: Fetch Official Rootfs & Inject Custom Kernel
        id: imagebuilder
        run: |
          BRANCH="${{ github.event.inputs.releases_branch }}"
          
          # 1. Unduh Rootfs mentah resmi yang bersih dari server basis data komunitas
          echo "Fetching clean base rootfs for: $BRANCH"
          if [ "$BRANCH" = "noble" ]; then
              wget -q https://github.com -O /builder/base_rootfs.tar.gz
          else
              wget -q https://github.com -O /builder/base_rootfs.tar.gz
          fi
          
          # 2. Ekstrak Rootfs dasar ke folder sementara menggunakan hak akses root
          sudo tar -mxf /builder/base_rootfs.tar.gz -C /builder/rootfs_tmp/
          
          # 3. Suntikkan berkas /boot dan /lib/modules milik kernel modifikasi Anda langsung ke rootfs
          echo "Injecting custom kernel files..."
          if [ -d "/builder/custom_kernel/boot" ]; then
              sudo cp -r /builder/custom_kernel/boot/* /builder/rootfs_tmp/boot/
          fi
          if [ -d "/builder/custom_kernel/lib/modules" ]; then
              sudo mkdir -p /builder/rootfs_tmp/lib/modules/
              sudo cp -r /builder/custom_kernel/lib/modules/* /builder/rootfs_tmp/lib/modules/
          fi
          
          # Atur standarisasi kepemilikan berkas ke root pengguna
          sudo chown -R root:root /builder/rootfs_tmp/boot/
          sudo chown -R root:root /builder/rootfs_tmp/lib/modules/
          
          # 4. Kustomisasi Akun Dasar: Aktifkan SSH root & pasang sandi bawaan '1234'
          SSH_CONFIG="/builder/rootfs_tmp/etc/ssh/sshd_config"
          if [ -f "$SSH_CONFIG" ]; then
              sudo sed -i "s|^#*PermitRootLogin .*|PermitRootLogin yes|g" $SSH_CONFIG
              sudo sed -i "s|^#*PasswordAuthentication .*|PasswordAuthentication yes|g" $SSH_CONFIG
          fi
          
          SHADOW_FILE="/builder/rootfs_tmp/etc/shadow"
          if [ -f "$SHADOW_FILE" ]; then
              ROOT_PASS_HASH="$(openssl passwd -6 "1234")"
              sudo sed -i "s|^root:\*|root:${ROOT_PASS_HASH}|" $SHADOW_FILE
          fi
          
          # 5. Bungkus kembali rootfs kustom baru Anda menjadi format tar.gz untuk di-repack oleh ophub
          echo "Compressing new custom rootfs..."
          cd /builder/rootfs_tmp/
          sudo tar -czf ${{ github.workspace }}/build/output/images/custom-rootfs.tar.gz *
          
          echo "build_tag=Armbian_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild Armbian for Target Boards (.img)
        id: packaging
        if: ${{ steps.imagebuilder.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/custom-rootfs.tar.gz
          armbian_board: ${{ github.event.inputs.armbian_board }}
          armbian_kernel: ${{ github.event.inputs.armbian_kernel }}
          auto_kernel: false
          kernel_repo: ${{ github.event.inputs.kernel_repo }}
          kernel_usage: ${{ github.event.inputs.kernel_tag }}

      - name: Move Repack Result to Output
        if: steps.packaging.outcome == 'success'
        run: |
          sudo cp -v ${{ env.PACKAGED_OUTPUTPATH }}/*.img* output/ 2>/dev/null || true
          echo "Final check folder output:"
          ls -lh output/
          
      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.build_tag }}
          artifacts: "output/*"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Armbian OS Custom Kernel For STB Amlogic
            - **Board**: ${{ github.event.inputs.armbian_board }}
            - **Kernel**: ${{ github.event.inputs.armbian_kernel }} (${{ github.event.inputs.kernel_repo }})
            - **Branch OS**: ${{ github.event.inputs.releases_branch }}
            - **Sandi Default Root**: 1234
