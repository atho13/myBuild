# =====================================================================
# Build Armbian Debian/Ubuntu Amlogic - Final Fixed Single Edition
# =====================================================================

name: Armbian Frdmx

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      releases_branch:
        description: "Select the releases branch (codename)"
        required: false
        default: "noble"
        type: choice
        options:
          - trixie
          - bookworm
          - noble
      armbian_board:
        description: "Select device board"
        required: false
        default: "s905x-b860h"
        type: choice
        options:
          - s905x-b860h
          - s905x-hg680p
          - s905x2-hg680fj
          - s905x2-s905y2
      armbian_kernel:
        description: "Select kernel version"
        required: false
        default: "6.18.y"
      kernel_repo:
        description: "Set your custom kernel repository (Username/Repo)"
        required: false
        default: "atho13/kernel"
      kernel_tag:
        description: "Set the Release Tag of your custom kernel"
        required: false
        default: "stable"

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        id: init
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org)
          sudo -E apt-get -y install zstd fakeroot gh
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Custom Kernel & Process Rootfs
        id: imagebuilder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Buat direktori kerja untuk kernel kustom
          mkdir -p /builder/custom_kernel
          cd /builder/custom_kernel
          
          # 2. Unduh paket kernel modifikasi (.tar.gz) langsung dari rilis GitHub Anda
          echo "Downloading kernel from ${{ github.event.inputs.kernel_repo }} tag ${{ github.event.inputs.kernel_tag }}"
          gh release download ${{ github.event.inputs.kernel_tag }} --repo ${{ github.event.inputs.kernel_repo }} --pattern "*.tar.gz" --skip-existing || true
          
          # 3. Ekstrak file kernel jika ditemukan
          if [ "$(ls -A . 2>/dev/null)" ]; then
              for f in *.tar.gz; do tar -xzvf "$f"; done
              rm -f *.tar.gz
          else
              echo "WARNING: Kernel tidak ditemukan! Menggunakan basis default."
          fi
          
          # 4. Kembali ke root repositori untuk eksekusi skrip bash
          cd ${{ github.workspace }}
          chmod +x ./compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
          
          # =========================================================================
          # HOTFIX PATCH: Paksa pembuatan konfigurasi APT yang bersih dari polusi teks
          # =========================================================================
          sudo rm -f /etc/apt/apt.conf
          echo 'APT::Get::AllowUnauthenticated "true";' | sudo tee /etc/apt/apt.conf
          
          # Buat skrip pembungkus apt-get palsu untuk membuang parameter ilegal jika dipanggil skrip bash
          sudo tee /usr/local/bin/apt-get << 'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
              # Abaikan jika parameter mengandung kata tab-size-preference
              if [[ "$arg" == *"--tab-size-preference"* ]]; then
                  continue
              fi
              args+=("$arg")
          done
          exec /usr/bin/apt-get "${args[@]}"
          EOF
          sudo chmod +x /usr/local/bin/apt-get
          
          # Bersihkan total variabel lingkungan host
          unset APT_CONFIG
          unset LESS
          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C
          # =========================================================================
          
          # Eksekusi skrip bash dengan menyisipkan folder kernel kustom di parameter -m
          ./compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh \
              -v "${{ github.event.inputs.releases_branch }}" \
              -s true \
              -c true \
              -k true \
              -m "/builder/custom_kernel"
          
          # Beri penanda sukses dan penamaan waktu rilis
          echo "build_tag=Armbian_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}
