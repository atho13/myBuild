# =====================================================================
# Build Armbian Debian/Ubuntu Amlogic - Single Workflow Edition
# =====================================================================

name: Armbian Frdmmx

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      releases_branch:
        description: "Select the releases branch (codename)"
        required: false
        default: "bookworm"
        type: choice
        options:
          - trixie
          - bookworm
          - noble
      armbian_board:
        description: "Select device board"
        required: false
        default: "s905x-b860h"
        type: choice
        options:
          - s905x-b860h
          - s905x-hg680p
          - s905x2-hg680fj
          - s905x2-s905y2
      armbian_kernel:
        description: "Select kernel version"
        required: false
        default: "6.18.y"
      kernel_repo:
        description: "Set your custom kernel repository (Username/Repo)"
        required: false
        default: "atho13/kernel"
      kernel_tag:
        description: "Set the Release Tag of your custom kernel"
        required: false
        default: "stable"

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        id: init
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org)
          sudo -E apt-get -y install zstd fakeroot gh
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create Simulated Physical Disk
        run: |
          sudo mkdir -p /builder
          sudo truncate -s 20G /builder/mnt.img
          sudo losetup /dev/loop6 /builder/mnt.img
          sudo mkfs.xfs /dev/loop6
          sudo mount /dev/loop6 /builder
          sudo chown -R runner:runner /builder

      - name: Download Custom Kernel & Process Rootfs
        id: imagebuilder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Buat direktori kerja untuk kernel kustom
          mkdir -p /builder/custom_kernel
          cd /builder/custom_kernel
          
          # 2. Unduh paket kernel modifikasi (.tar.gz) langsung dari rilis GitHub Anda
          echo "Downloading kernel from ${{ github.event.inputs.kernel_repo }} tag ${{ github.event.inputs.kernel_tag }}"
          gh release download ${{ github.event.inputs.kernel_tag }} --repo ${{ github.event.inputs.kernel_repo }} --pattern "*.tar.gz" --skip-existing || true
          
          # 3. Ekstrak file kernel jika ditemukan
          if [ "$(ls -A . 2>/dev/null)" ]; then
              for f in *.tar.gz; do tar -xzvf "$f"; done
              rm -f *.tar.gz
          else
              echo "WARNING: Kernel tidak ditemukan! Menggunakan basis default."
          fi
          
          # 4. Kembali ke root repositori untuk menjalankan skrip bash Anda langsung dari .yml
          cd ${{ github.workspace }}
          chmod +x ./compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh
          
          # Eksekusi skrip Anda dengan menyisipkan folder kernel kustom di parameter -m
          ./compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh \
              -v "${{ github.event.inputs.releases_branch }}" \
              -s true \
              -c true \
              -k true \
              -m "/builder/custom_kernel"
          
          # Beri tanda penanda sukses dan penamaan waktu rilis
          echo "build_tag=Armbian_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild Armbian for Target Boards (.img)
        id: packaging
        if: ${{ steps.imagebuilder.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/*.tar.gz    # Mengarah ke lokasi file .tar.gz hasil kompresi skrip bash Anda
          armbian_board: ${{ github.event.inputs.armbian_board }}
          armbian_kernel: ${{ github.event.inputs.armbian_kernel }}
          auto_kernel: false                     # Dikunci ke false agar kernel modifikasi Anda tidak ditimpa
          kernel_repo: ${{ github.event.inputs.kernel_repo }}
          kernel_usage: ${{ github.event.inputs.kernel_tag }}

      - name: Move Repack Result to Output
        if: steps.packaging.outcome == 'success'
        run: |
          mkdir -p output/
          sudo cp -v ${{ env.PACKAGED_OUTPUTPATH }}/*.img* output/ 2>/dev/null || true
          echo "Final check folder output:"
          ls -lh output/
          
      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.build_tag }}
          artifacts: "output/*"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Armbian OS Custom Kernel For B860H
            - **Board**: ${{ github.event.inputs.armbian_board }}
            - **Kernel**: ${{ github.event.inputs.armbian_kernel }} (${{ github.event.inputs.kernel_repo }})
            - **Branch OS**: ${{ github.event.inputs.releases_branch }}
