# =====================================================================
# Build Armbian Amlogic - 100% Full URL Fixed Version (deb-6.18.37 Edition)
# =====================================================================

name: Amlogic FRDMX Armbian

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      releases_branch:
        description: "Select the releases branch (codename)"
        required: false
        default: "noble"
        type: choice
        options:
          - bookworm
          - noble
      armbian_board:
        description: "Select device board"
        required: false
        default: "s905x-b860h"
        type: choice
        options:
          - s905x-b860h
          - s905x-hg680p
          - s905x2-hg680fj
          - s905x2-s905y2
      armbian_kernel:
        description: "Select kernel version"
        required: false
        default: "deb-6.18.37"

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        id: init
        run: |
          sudo rm -f /etc/apt/apt.conf
          unset APT_CONFIG
          export DEBIAN_FRONTEND=noninteractive
          
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential libncurses5-dev libssl-dev bc bison flex \
            libelf-dev xz-utils git curl wget jq pigz zstd fakeroot gh \
            binutils patch bzip2 gawk gettext unzip zip python3 python3-pip
          
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create Work Directory
        run: |
          sudo mkdir -p /builder/custom_kernel
          sudo mkdir -p /builder/rootfs_tmp
          mkdir -p output/
          mkdir -p build/output/images/

      - name: Download Custom Kernel
        id: get_kernel
        run: |
          sudo chown -R runner:runner /builder
          cd /builder/custom_kernel
          
          echo "Downloading kernel via direct link..."
          wget -q "https://github.com/atho13/kernel/releases/download/kernel_stable/deb-6.18.37.tar.gz" -O deb-6.18.37.tar.gz
          
          if [ -f "deb-6.18.37.tar.gz" ]; then
              tar -xzvf deb-6.18.37.tar.gz
              rm -f deb-6.18.37.tar.gz
              echo "Kernel extracted successfully."
              echo "status=success" >> ${GITHUB_OUTPUT}
          else
              echo "ERROR: Gagal mengunduh berkas kernel kustom lewat Direct Link!"
              exit 1
          fi

      - name: Fetch Official Rootfs & Inject Custom Kernel
        id: imagebuilder
        if: ${{ steps.get_kernel.outputs.status == 'success' }}
        run: |
          sudo chown -R runner:runner /builder
          BRANCH="${{ github.event.inputs.releases_branch }}"
          
          echo "Fetching clean base rootfs for: $BRANCH"
          if [ "$BRANCH" = "noble" ]; then
              wget -q "https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_noble_arm64_server_2026.07/Armbian_26.08.0-noble_arm64_6.18.37_rootfs.tar.gz" -O /builder/base_rootfs.tar.gz
          else
              wget -q "https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_noble_arm64_server_2026.07/Armbian_26.08.0-noble_arm64_6.18.37_rootfs.tar.gz" -O /builder/base_rootfs.tar.gz
          fi
          
          sudo tar -mxf /builder/base_rootfs.tar.gz -C /builder/rootfs_tmp/
          
          echo "Injecting custom kernel files..."
          sudo mkdir -p /builder/rootfs_tmp/boot/
          sudo mkdir -p /builder/rootfs_tmp/lib/modules/

          if [ -d "/builder/custom_kernel/boot" ]; then
              sudo cp -r /builder/custom_kernel/boot/* /builder/rootfs_tmp/boot/
          fi
          if [ -d "/builder/custom_kernel/lib/modules" ]; then
              sudo cp -r /builder/custom_kernel/lib/modules/* /builder/rootfs_tmp/lib/modules/
          fi
          
          sudo chown -R root:root /builder/rootfs_tmp/boot/
          sudo chown -R root:root /builder/rootfs_tmp/lib/modules/
          
          SSH_CONFIG="/builder/rootfs_tmp/etc/ssh/sshd_config"
          if [ -f "$SSH_CONFIG" ]; then
              sudo sed -i "s|^#*PermitRootLogin .*|PermitRootLogin yes|g" $SSH_CONFIG
              sudo sed -i "s|^#*PasswordAuthentication .*|PasswordAuthentication yes|g" $SSH_CONFIG
          fi
          
          SHADOW_FILE="/builder/rootfs_tmp/etc/shadow"
          if [ -f "$SHADOW_FILE" ]; then
              ROOT_PASS_HASH="$(openssl passwd -6 "1234")"
              sudo sed -i "s|^root:\*|root:${ROOT_PASS_HASH}|" $SHADOW_FILE
          fi
          
          echo "Compressing new custom rootfs into fake img.gz..."
          cd /builder/rootfs_tmp/
          sudo tar -czf ${{ github.workspace }}/build/output/images/Armbian_fake_rootfs_image.img.gz *
          
          echo "build_tag=Armbian_$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild Armbian for Target Boards (.img)
        id: packaging
        if: ${{ steps.imagebuilder.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/Armbian_fake_rootfs_image.img.gz
          armbian_board: ${{ github.event.inputs.armbian_board }}
          armbian_kernel: ${{ github.event.inputs.armbian_kernel }}
          auto_kernel: false
          kernel_repo: atho13/kernel
          kernel_usage: kernel_stable # Disesuaikan ke rumpun stable agar sinkron dengan log integritas data sebelumnya

      - name: Move Repack Result to Output
        if: steps.packaging.outcome == 'success'
        run: |
          sudo cp -v ${{ env.PACKAGED_OUTPUTPATH }}/*.img* output/ 2>/dev/null || true
          echo "Final check folder output:"
          ls -lh output/
          
      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.build_tag }}
          artifacts: "output/*"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Armbian OS Custom Kernel For STB Amlogic
            - **Board**: ${{ github.event.inputs.armbian_board }}
            - **Kernel**: ${{ github.event.inputs.armbian_kernel }} (atho13/kernel)
            - **Branch OS**: ${{ github.event.inputs.releases_branch }}
            - **Sandi Default Root**: 1234
