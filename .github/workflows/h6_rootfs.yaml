name: Frdmx Allwinner rootFS

on:
  workflow_dispatch:
    inputs:
      custom_url:
        description: "URL Image Builder (.tar.xz/.tar.zst) versi 23.05, 24.10, atau 25.12"
        required: true
        default: ""

env:
  TZ: Asia/Jakarta
  WORKING_DIR: /builder/armvirt_ib
  OUTPUT_DIR: \${{ github.workspace }}/output

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Inisialisasi Lingkungan & Dependensi
        run: |
          sudo timedatectl set-timezone "\${{ env.TZ }}"
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
          git libncurses5-dev libssl-dev rsync unzip zlib1g-dev \
          curl tar qemu-utils wget python3-setuptools python3-dev zstd xz-utils dos2unix
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          sudo mkdir -p /builder
          sudo chown runner:runner /builder
          mkdir -p \${{ env.OUTPUT_DIR }}

      - name: Unduh & Ekstrak Image Builder
        run: |
          mkdir -p \${{ env.WORKING_DIR }}
          curl -L "\${{ github.event.inputs.custom_url }}" -o ib_archive.file
          tar -xf ib_archive.file -C \${{ env.WORKING_DIR }} --strip-components=1
          rm ib_archive.file

      - name: Suntik Skrip Otomatis WiFi Langsung ON (uci-defaults)
        run: |
          LOCAL_FILES_DIR="\${{ github.workspace }}/h6/etc/uci-defaults"
          mkdir -p \$LOCAL_FILES_DIR
          
          cat << 'EOF' > \$LOCAL_FILES_DIR/99-custom-wifi
          #!/bin/sh
          
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio1.disabled='0' 2>/dev/null || true
          
          uci set wireless.default_radio0.ssid='FRDMX-Wrt'
          uci set wireless.default_radio1.ssid='FRDMX-Wrt_5G' 2>/dev/null || true
          
          uci commit wireless
          /etc/init.d/network restart
          
          exit 0
          EOF
          
          chmod +x \$LOCAL_FILES_DIR/99-custom-wifi

      - name: Membangun RootFS Allwinner
        run: |
          cd \${{ env.WORKING_DIR }}
        
          # Mengatur kapasitas default partisi rootfs komunitas (700MB)
          sed -i '/CONFIG_TARGET_ROOTFS_PARTSIZE/d' .config 2>/dev/null || true
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=700" >> .config
        
          if [ -d "\${{ github.workspace }}/h6/etc/uci-defaults" ]; then
            echo "Memperbaiki format EOL skrip uci-defaults..."
            dos2unix \${{ github.workspace }}/h6/etc/uci-defaults/* || true
            chmod +x \${{ github.workspace }}/h6/etc/uci-defaults/* || true
            
            mkdir -p build_dir/target-aarch64_generic_musl/root-armvirt/etc/uci-defaults
            cp -r \${{ github.workspace }}/h6/etc/uci-defaults/* build_dir/target-aarch64_generic_musl/root-armvirt/etc/uci-defaults/
            chmod +x build_dir/target-aarch64_generic_musl/root-armvirt/etc/uci-defaults/*
          fi
        
          PACKAGES="-dnsmasq dnsmasq-full base-files dropbear e2fsprogs firewall4 fstools tc-full \
          kmod-button-hotplug kmod-nft-offload libc libgcc libustream-mbedtls logd kmod-tcp-bbr \
          mkf2fs mtd netifd nftables odhcp6c -odhcpd-ipv6only odhcpd partx-utils ppp ppp-mod-pppoe procd-ujail \
          uci uclient-fetch urandom-seed urngd luci luci-compat luci-lib-base kmod-usb-net-huawei-cdc-ncm \
          kmod-usb-net kmod-usb-net-rndis luci-lib-ip luci-lib-jsonc luci-lib-nixio luci-mod-admin-full \
          luci-mod-network kmod-usb-net-rtl8150 kmod-usb-net-rtl8152 kmod-usb-net-asix kmod-usb-net-asix-ax88179 \
          kmod-mii luci-mod-status luci-mod-system luci-proto-3g luci-proto-mbim mbim-utils picocom minicom \
          luci-proto-ncm luci-proto-ppp luci-proto-qmi screen kmod-tun ttyd kmod-usb-atm kmod-macvlan \
          kmod-usb-net-cdc-ncm kmod-usb-net-cdc-mbim luci-proto-modemmanager modemmanager modemmanager-rpcd qmi-utils \
          libqmi libmbim glib2 ipset libcap libcap-bin ruby ruby-yaml kmod-inet-diag kmod-nft-tproxy mbim-utils sms-tool \
          ip-full php8 tcpdump bc uhttpd uhttpd-mod-ubus unzip qmi-utils kmod-usb-net-qmi-wwan \
          uqmi usb-modeswitch uuidgen zstd wwan ziptool zoneinfo-asia zoneinfo-core zram-swap bash kmod-usb-core \
          openssh-sftp-server adb wget-ssl httping htop jq tar coreutils-sleep coreutils-stat nano fping \
          kmod-nls-utf8 kmod-usb-storage cgi-io chattr comgt comgt-ncm coremark coreutils coreutils-base64 \
          coreutils-nohup kmod-usb-net-sierrawireless kmod-usb-serial-qualcomm kmod-usb-serial-sierrawireless \
          luci-app-ttyd luci-theme-material iw iwinfo vnstat2 vnstati2 php8-mod-mbstring php8-cli usbutils usbids \
          php8-fastcgi php8-fpm php8-mod-session php8-mod-ctype php8-mod-fileinfo php8-mod-zip php8-mod-iconv \
          kmod-mhi-net kmod-mhi-bus kmod-mhi-pci-generic kmod-mhi-wwan-ctrl kmod-mhi-wwan-mbim kmod-sched-cake \
          kmod-usb2 kmod-usb3 kmod-usb-serial-option kmod-usb-net-cdc-ether kmod-usb-wdm kmod-usb-serial-wwan usbmuxd \
          kmod-usb-net-ipheth chat kmod-usb-acm ntfs-3g kmod-fs-ntfs3 kmod-fs-exfat fdisk \
          ntfs-3g-utils block-mount kmod-usb-storage-uas smartmontools procps-ng-watch jq iperf3 ca-certificates \
          python3-light python3-pkg-resources python3-xml python3-email python3-urllib python3-codecs python3-openssl \
          luci-app-diskman wpad-mesh-openssl wireless-regdb"
    
          CURRENT_PROFILE="generic"
          if ! make info | grep -q "Profile: \$CURRENT_PROFILE"; then
            CURRENT_PROFILE=\$(make info | grep -E '^Profile:' | head -n 1 | awk '{print \$2}')
          fi
        
          make image PROFILE="\$CURRENT_PROFILE" \
               PACKAGES="\${PACKAGES}" \
               FILES="\${{{ github.workspace }}}/h6" \
               IGNORE_ERRORS=1 \
               V=s

        - name: Ekstraksi dan Penamaan Hasil Akhir
        run: |
          BASE_TARGET_DIR="\${{ env.WORKING_DIR }}/bin/targets"
          
          if [ -d "\$BASE_TARGET_DIR" ]; then
            ZST_FILE=(find "BASE_TARGET_DIR" -type f -name "*rootfs.tar.zst" | head -n 1)
            GZ_FILE=(find "BASE_TARGET_DIR" -type f -name "*rootfs.tar.gz" | head -n 1)
            
            OUT_NAME="openwrt-allwinner-generic-rootfs.tar.gz"
            
            if [ -n "\$ZST_FILE" ]; then
              zstd -d -c "\$ZST_FILE" | gzip > "\({{ env.OUTPUT_DIR }}/\)OUT_NAME"
            elif [ -n "\$GZ_FILE" ]; then
              cp "\$GZ_FILE" "\({{ env.OUTPUT_DIR }}/\)OUT_NAME"
            else
              echo "Error: Berkas pembangun rootfs tidak ditemukan!"
              exit 1
            fi
          else
            echo "Error: Direktori utama build tidak ditemukan!"
            exit 1
          fi       
          
          VERSION_TAG="23.05"
          if [[ "\${{ github.event.inputs.custom_url }}" == *"25.12"* ]]; then VERSION_TAG="25.12"; fi
          if [[ "\${{ github.event.inputs.custom_url }}" == *"24.10"* ]]; then VERSION_TAG="24.10"; fi
          
          echo "build_tag=ALLWINNER_RootFS_\${VERSION_TAG}_\((date +'\%Y\%m\%d_\%H\%M')" >> \)GITHUB_ENV

      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: \${{ env.build_tag }}
          artifacts: "\${{ env.OUTPUT_DIR }}/*.tar.gz"
          allowUpdates: true
          makeLatest: true
          token: \${{ secrets.GITHUB_TOKEN }}
          body: |
            ## OpenWrt RootFS FRDMX - Murni Allwinner Edition (Wi-Fi ON)
            - **Format Berkas**: `.tar.gz` (Universal Format)
            - **Folder Konfigurasi**: `h6` (Khusus Allwinner)
