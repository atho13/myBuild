name: Making Opizz

on:
  workflow_dispatch:
    inputs:
      openwrt_ver:
        description: 'Select OpenWrt Version'
        required: true
        default: '24.10.x'
        type: choice
        options:
          - 21.02.x
          - 23.05.x
          - 24.10.x
          - 25.12.x
      board_version:
        description: 'Select board version to compile'
        required: true
        default: 'orangepi-zero3'
        type: choice
        options:
          - orangepi-zero3
          - s905x
          - s905x-b860h
          - h96-max-m2
          - nanopi-r5c
          - nanopi-r5s
          - orangepi-5-plus
          - rk3318-box
          - s905-beelink-mini
          - s905-mxqpro-plus
          - s905l-b860av21u
          - s905w
          - s905x2
          - s905x3
          - s905x3-h96max
          - s905x3-x96max
          - s912
          - s912-nexbox-a1
          - s912-nexbox-a2
          - s922x
          - tanix-tx6
          - all
      kernel_version:
        description: 'Select kernel version'
        required: true
        default: '6.6.y'
        type: choice
        options:
          - 5.10.y
          - 5.15.y
          - 5.4.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.14.y
          - 6.17.y
          - 6.18.y
      rootfs_size:
        description: 'Select Rootfs Size (MB)'
        required: true
        default: '1024'
        type: choice
        options:
          - 256
          - 512
          - 768
          - 1024
          - 1536
      auto_kernel:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      kernel_repo:
        description: "Set the kernel repository"
        required: false
        default: "https://github.com/atho13/kernel"
      rootfs_url:
        description: 'Input Rootfs URL (Wget Only)'
        required: true
        default: ''

env:
  TZ: Asia/Jakarta

jobs:
  download:
    name: Download Rootfs
    runs-on: ubuntu-latest
    steps:
      - name: Download Rootfs
        run: |
          wget "${{ github.event.inputs.rootfs_url }}"
          ROOTFS_PATH=$(find ./ -name "*rootfs.tar.gz" | head -n 1)
          if [ -z "$ROOTFS_PATH" ]; then
            echo "Error: Berkas rootfs.tar.gz tidak ditemukan!"
            exit 1
          fi
          echo "ROOTFS_PATH=$ROOTFS_PATH" >> $GITHUB_ENV
          
      - name: Upload Rootfs
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rootfs
          path: ${{ env.ROOTFS_PATH }}

  build_specific:
    name: Build ${{ github.event.inputs.board_version }}
    runs-on: ubuntu-22.04
    needs: download
    if: github.event.inputs.board_version != 'all'
    steps:
      - name: Clone OpenWrt Builder Packaging
        run: |
          git clone --depth 1 https://ophub/amlogic-s9xxx-openwrt
          cd amlogic-s9xxx-openwrt
          mkdir -p openwrt-armsr
    
      - name: Download Rootfs Artifact
        uses: actions/download-artifact@v4
        with:
          name: openwrt-rootfs
          path: ./amlogic-s9xxx-openwrt/openwrt-armsr/
          
      - name: Build Firmware Single Board
        run: |
          cd amlogic-s9xxx-openwrt
          # Memastikan file rootfs terbaca dengan nama yang dikenali skrip remake Ophub
          cd openwrt-armsr && mv *.tar.gz openwrt-s905x-generic-rootfs.tar.gz 2>/dev/null || true
          cd ..
          sudo ./remake -b ${{ github.event.inputs.board_version }} -k ${{ github.event.inputs.kernel_version }} -s ${{ github.event.inputs.rootfs_size }}
      
      - name: Find Firmware
        run: |
          FILE_PATH=$(find ./amlogic-s9xxx-openwrt/openwrt/out/ -name "*.img.gz" | head -n 1)
          if [[ -z "$FILE_PATH" ]]; then
            echo "Error: Tidak ada file firmware .img.gz ditemukan!"
            exit 1
          fi
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.AKSI_GITHUB }}
        with:
          name: FRDMX-Wrt-${{ github.event.inputs.board_version }}-${{ github.event.inputs.openwrt_ver }}
          tag_name: v${{ github.event.inputs.openwrt_ver }}_${{ github.event.inputs.board_version }}_k${{ github.event.inputs.kernel_version }}
          draft: false
          prerelease: false
          files: ${{ env.FILE_PATH }}
          body: |
            ### Information
            * Board Target: ${{ github.event.inputs.board_version }}
            * Kernel: ${{ github.event.inputs.kernel_version }}
            * Default IP: 192.168.1.1
            * Default username: frmdx

  build_all:
    name: Build All Matrices
    runs-on: ubuntu-22.04
    needs: download
    if: github.event.inputs.board_version == 'all'
    strategy:
      matrix:
        board_version: 
          - h96-max-m2
          - nanopi-r5c
          - nanopi-r5s
          - orangepi-5-plus
          - orangepi-zero3
          - rk3318-box
          - s905-beelink-mini
          - s905-mxqpro-plus
          - s905l-b860av21u
          - s905w
          - s905x2
          - s905x3
          - s905x3-h96max
          - s905x3-x96max
          - s912
          - s912-nexbox-a1
          - s912-nexbox-a2
          - s922x
          - tanix-tx6
    steps:
      - name: Clone OpenWrt Builder Packaging
        run: |
          git clone --depth 1 https://ophub/amlogic-s9xxx-openwrt
          cd amlogic-s9xxx-openwrt
          mkdir -p openwrt-armsr
    
      - name: Download Rootfs Artifact
        uses: actions/download-artifact@v4
        with:
          name: openwrt-rootfs
          path: ./amlogic-s9xxx-openwrt/openwrt-armsr/
          
      - name: Build Firmware Matrix
        run: |
          cd amlogic-s9xxx-openwrt
          cd openwrt-armsr && mv *.tar.gz openwrt-s905x-generic-rootfs.tar.gz 2>/dev/null || true
          cd ..
          sudo ./remake -b ${{ matrix.board_version }} -k ${{ github.event.inputs.kernel_version }} -s ${{ github.event.inputs.rootfs_size }}
      
      - name: Find Firmware
        run: |
          FILE_PATH=$(find ./amlogic-s9xxx-openwrt/openwrt/out/ -name "*.img.gz" | head -n 1)
          if [[ -z "$FILE_PATH" ]]; then
            echo "Error: Tidak ada file firmware .img.gz ditemukan!"
            exit 1
          fi
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.AKSI_GITHUB }}
        with:
          name: FRDM-Wrt-Multi-${{ github.event.inputs.openwrt_ver }}
          tag_name: v${{ github.event.inputs.openwrt_ver }}_matrix_k${{ github.event.inputs.kernel_version }}
          draft: false
          prerelease: false
          files: ${{ env.FILE_PATH }}
          body: |
            ### FRDMX-Wrt Multi-Platform Information
            * Kernel: ${{ github.event.inputs.kernel_version }}
            * Default IP: 192.168.1.1
            * Default username: frdmx
